---
# Resuelve la IP real de cada servidor SIN preguntar nada si el inventario ya
# la tiene. Solo pregunta cuando el inventario todavia tiene el placeholder
# (un repo recien clonado, sin editar) o quedo vacio.
#
# Para fijar otra IP sin editar el inventario ni que pregunte nada -- por
# ejemplo, para reusar este mismo repo contra otro par de VMs, o durante la
# captura de evidencias -- se pasa por linea de comandos con -e (Ansible no
# pregunta por una variable que ya llega definida asi):
#   ansible-playbook site.yml -e ip_web=10.0.0.10 -e ip_db=10.0.0.11
#
# tags: [always] para que esto corra aunque se use -t db o -t web.

- name: Resolver la IP real de cada servidor
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: Preguntar la IP de la VM CentOS / servidor web (solo si el inventario no tiene una real)
      ansible.builtin.pause:
        prompt: "IP de la VM CentOS / servidor web (Enter para mantener la del inventario)"
      register: r_ip_web
      when:
        - ip_web is not defined
        - "'CAMBIAR' in hostvars['web'].ansible_host or hostvars['web'].ansible_host | length == 0"

    - name: Preguntar la IP de la VM Ubuntu / servidor de base de datos (solo si el inventario no tiene una real)
      ansible.builtin.pause:
        prompt: "IP de la VM Ubuntu / servidor de base de datos (Enter para mantener la del inventario)"
      register: r_ip_db
      when:
        - ip_db is not defined
        - "'CAMBIAR' in hostvars['db'].ansible_host or hostvars['db'].ansible_host | length == 0"

    - name: Usar la IP de web (por -e, por la pregunta, o la que ya tiene el inventario)
      ansible.builtin.add_host:
        name: web
        ansible_host: >-
          {{ ip_web | default(r_ip_web.user_input | default('', true), true)
             | default(hostvars['web'].ansible_host, true) }}

    - name: Usar la IP de db (por -e, por la pregunta, o la que ya tiene el inventario)
      ansible.builtin.add_host:
        name: db
        ansible_host: >-
          {{ ip_db | default(r_ip_db.user_input | default('', true), true)
             | default(hostvars['db'].ansible_host, true) }}

    - name: Confirmar que ninguna quedo con el placeholder original
      ansible.builtin.assert:
        that:
          - "'CAMBIAR' not in hostvars[item].ansible_host"
        fail_msg: >-
          Falta la IP real de {{ item }}. Ponerla en inventory/hosts.ini o
          escribirla cuando el playbook la pregunta.
      loop: ["web", "db"]
