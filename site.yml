---
# Playbook principal del obligatorio.
#
#   ansible-playbook site.yml
#
# Requiere que bootstrap.yml se haya corrido una vez. Ver docs/INSTALL.md.
#
# En cada play el rol de firewall va DESPUES del rol funcional a proposito: si
# algo falla a mitad de camino, no nos quedamos sin SSH antes de haber terminado.

- name: Preparacion comun de los dos servidores
  hosts: servidores
  become: true
  gather_facts: true
  tags: [comun]
  roles:
    - role: common

- name: Servidor de base de datos (Ubuntu Server + MariaDB)
  hosts: db
  become: true
  gather_facts: true
  tags: [db]
  roles:
    - role: mariadb
    - role: firewall

- name: Servidor de aplicacion (CentOS Stream + Apache + PHP)
  hosts: web
  become: true
  gather_facts: true
  tags: [web]
  roles:
    - role: webapp
    - role: firewall

- ansible.builtin.import_playbook: validar.yml
  tags: [validar]
