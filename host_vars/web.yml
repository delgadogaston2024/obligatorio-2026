---
# Servidor de aplicacion: CentOS Stream 9 con Apache + PHP.

# En la familia RHEL el sudoers base habilita %wheel; en Debian/Ubuntu, %sudo.
admin_group: wheel

apache_user: apache
apache_group: apache

# DocumentRoot de la aplicacion.
app_root: /var/www/html/cumples
app_entry_file: cumple.php

app_private_dir: /var/www/private/cumples
app_config_file: db_config.php

web_packages:
  - httpd
  - php
  - php-fpm
  - php-mysqlnd
  - python3-libselinux    # requerido por ansible.posix.seboolean
  - python3-libsemanage   # requerido por el manejo persistente de booleanos
  - python3-firewall      # requerido por ansible.posix.firewalld
  - policycoreutils-python-utils  # ausearch/semanage, para diagnosticar AVC

web_services:
  - php-fpm
  - httpd
