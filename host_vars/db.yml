---
# Servidor de base de datos: Ubuntu Server con MariaDB.

# En Debian/Ubuntu el sudoers base habilita %sudo; en la familia RHEL, %wheel.
admin_group: sudo

# Ubuntu 26.04 trae sudo-rs como implementacion por defecto de /usr/bin/sudo
# (via update-alternatives). sudo-rs envuelve el prompt personalizado que pasa
# `-p` como "[sudo: <prompt>] Password:" en vez de mostrarlo literal, y el
# plugin become=sudo de Ansible espera que la linea EMPIECE con el prompt
# exacto que genera (ver ansible/plugins/become/__init__.py:check_password_prompt,
# `l.strip().startswith(b_prompt)`). Como nunca matchea, toda tarea con become
# contra este host cuelga con "Timeout (12s) waiting for privilege escalation
# prompt", sin importar que la contrasena sea correcta. El sudo clasico
# (1.9.17p2) ya esta instalado en paralelo en /usr/bin/sudo.ws y respeta `-p`
# literal, asi que apuntamos el become ahi en vez de tocar el alternative del
# sistema.
ansible_become_exe: /usr/bin/sudo.ws #para ubuntu 24.04 se debe dejar este comando como ansible_become_exe: /usr/bin/sudo

mariadb_service: mariadb
mariadb_socket: /run/mysqld/mysqld.sock
mariadb_conf_dir: /etc/mysql/mariadb.conf.d

# Se escucha en la IP concreta del servidor, no en 0.0.0.0: es lo minimo
# necesario para que la conexion desde el server web funcione.
mariadb_bind_address: "{{ db_host }}"

# Donde queda el esquema renderizado en el servidor.
mariadb_schema_dir: /usr/local/share/cumples
mariadb_schema_file: /usr/local/share/cumples/schema.sql

db_packages:
  - mariadb-server
  - mariadb-client      # ansible.mariadb invoca el binario mysql para state=import
  - python3-pymysql     # requerido por todos los modulos ansible.mariadb
