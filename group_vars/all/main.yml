---
# Variables compartidas por los dos servidores.
# Todo lo que cambia entre equipos se toca aca, no dentro de los roles.

# Usuario de automatizacion. Lo crea requisito.yml y es el que usa despliegue.yml.
requisito_user: ansible
ansible_user: "{{ requisito_user }}"
ansible_python_interpreter: /usr/bin/python3

requisito_pubkey_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_ed25519.pub"

zona_horaria: America/Montevideo

# --- Identidad de la aplicacion y de la base de datos ---------------------
db_name: cumples
db_table: cumpleanios
db_app_user: intranet_user
db_app_password: "{{ vault_db_app_password }}"
db_port: 3306

# --- Direcciones ----------------------------------------------------------
web_host: "{{ hostvars['web'].ansible_host }}"
db_host: "{{ hostvars['db'].ansible_host }}"

# --- Datos iniciales de la tabla -----------------------------------------
cumpleanios_seed:
  - { nombre: "Frodo Baggins", fecha: "2005-01-14" }
  - { nombre: "Aragorn", fecha: "2004-02-09" }
  - { nombre: "Arwen Undomiel", fecha: "1994-12-09" }

# Persona opcional por extra-var (-e). Vacios por defecto: no cambia el despliegue.
cumpleanio_extra_nombre: ""
cumpleanio_extra_fecha: ""

# Lista que usa mariadb y validacion: seed + persona extra si se pasaron ambos -e.
cumpleanios_efectivos: >-
  {{ cumpleanios_seed + (
       [{'nombre': cumpleanio_extra_nombre, 'fecha': cumpleanio_extra_fecha}]
       if cumpleanio_extra_nombre | length > 0 and cumpleanio_extra_fecha | length > 0
       else []
     ) }}
