---
# Validaciones del despliegue.
# Para ejecutar:
# ansible-playbook validar.yml
# Ninguna tarea de este playbook modifica los servidores: todas leen y comparan.
# El orden de los plays importa.

- name: Validar el servidor de base de datos
  hosts: db
  become: true
  gather_facts: true
  tags: [validar]
  roles:
    - role: validacion

- name: Validar el servidor de aplicacion y la aplicacion de punta a punta
  hosts: web
  become: true
  gather_facts: true
  tags: [validar]
  roles:
    - role: validacion
