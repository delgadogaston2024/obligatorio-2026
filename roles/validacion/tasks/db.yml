---
# Validaciones del servidor de base de datos.

- name: Recolectar el estado de los servicios
  ansible.builtin.service_facts:

- name: Confirmar que MariaDB esta corriendo y habilitada al arranque
  ansible.builtin.assert:
    that:
      - ansible_facts.services['mariadb.service'].state == 'running'
      - ansible_facts.services['mariadb.service'].status == 'enabled'
    success_msg: "MariaDB corriendo y habilitada al arranque."
    fail_msg: >-
      MariaDB no esta operativa. Revisar: systemctl status mariadb y
      journalctl -u mariadb -n 50

- name: Confirmar que MariaDB escucha en la IP del servidor y no en 127.0.0.1
  # Conectarse a una IP concreta solo funciona si hay un socket escuchando en esa
  # direccion. Es la prueba de que el drop-in del bind-address se aplico.
  ansible.builtin.wait_for:
    host: "{{ db_host }}"
    port: "{{ db_port }}"
    timeout: 10
    state: started

- name: Contar las filas de la tabla
  community.mysql.mysql_query:
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS n FROM `{{ db_table }}`"
    login_unix_socket: "{{ mariadb_socket }}"
  register: r_conteo
  changed_when: false
  check_mode: false

- name: Confirmar que la tabla tiene los datos esperados
  ansible.builtin.assert:
    that:
      - r_conteo.query_result[0][0].n | int == cumpleanios_seed | length
    success_msg: >-
      {{ db_name }}.{{ db_table }} tiene
      {{ r_conteo.query_result[0][0].n }} filas, las esperadas.
    fail_msg: >-
      {{ db_name }}.{{ db_table }} tiene {{ r_conteo.query_result[0][0].n }} filas
      y se esperaban {{ cumpleanios_seed | length }}. Si se agregaron personas a
      mano en la base, sobran; si se agregaron a cumpleanios_seed, volver a correr
      el playbook para que las cargue.

- name: Consultar desde donde puede conectarse el usuario de la aplicacion
  # mysql.user es una vista de compatibilidad cuya columna real es "Host"
  # (mayuscula). Sin alias explicito, el conector devuelve la fila con esa
  # clave tal cual esta definida en el catalogo, no como se escribio en el
  # SELECT, y ".host" en minuscula falla mas abajo.
  community.mysql.mysql_query:
    login_db: mysql
    query: "SELECT host AS host FROM mysql.user WHERE user = %s"
    positional_args:
      - "{{ db_app_user }}"
    login_unix_socket: "{{ mariadb_socket }}"
  register: r_usuario
  changed_when: false
  check_mode: false

- name: Confirmar que el usuario de la aplicacion solo entra desde el servidor web
  # El GRANT tiene que ser para la IP de web, no para '%'. Que exista el usuario
  # no alcanza: si quedo abierto a cualquier origen, la consigna no se cumple.
  ansible.builtin.assert:
    that:
      - r_usuario.query_result[0] | length == 1
      - r_usuario.query_result[0][0].host == web_host
    success_msg: "{{ db_app_user }} solo puede conectarse desde {{ web_host }}."
    fail_msg: >-
      {{ db_app_user }} esta autorizado desde
      {{ r_usuario.query_result[0] | map(attribute='host') | join(', ') }}
      y deberia estarlo solo desde {{ web_host }}.

- name: Leer el estado de UFW
  # Segunda y ultima tarea del proyecto que usa command. Es de solo lectura, y no
  # existe un modulo ufw_info (al contrario de firewalld_info). Sirve tambien como
  # evidencia legible en el log de la entrega.
  ansible.builtin.command:
    cmd: ufw status verbose
  changed_when: false
  check_mode: false
  register: r_ufw

- name: Confirmar que UFW deniega por defecto y solo abre el 3306 hacia el web
  ansible.builtin.assert:
    that:
      - "'Status: active' in r_ufw.stdout"
      - "'deny (incoming)' in r_ufw.stdout"
      - "(db_port | string) in r_ufw.stdout"
      - "web_host in r_ufw.stdout"
    success_msg: "UFW activo, denegando entrante y con el 3306 abierto solo a {{ web_host }}."
    fail_msg: |-
      UFW no quedo como se espera. Estado actual:
      {{ r_ufw.stdout }}
