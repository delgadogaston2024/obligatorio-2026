---
# Servidor de base de datos: MariaDB en Ubuntu Server.

- name: Instalar MariaDB y las dependencias de Python
  ansible.builtin.apt:
    name: "{{ db_packages }}"
    state: present

- name: Configurar MariaDB para aceptar conexiones desde el servidor web
  ansible.builtin.template:
    src: 99-ansible.cnf.j2
    dest: "{{ mariadb_conf_dir }}/99-ansible.cnf"
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar MariaDB

- name: Habilitar y arrancar MariaDB
  ansible.builtin.service:
    name: "{{ mariadb_service }}"
    state: started
    enabled: true

- name: Aplicar el reinicio pendiente antes de tocar la base
  ansible.builtin.meta: flush_handlers

- name: Esperar a que MariaDB acepte conexiones por el socket local
  ansible.builtin.wait_for:
    path: "{{ mariadb_socket }}"
    timeout: 30

- name: Crear la base de datos
  ansible.mariadb.mariadb_db:
    name: "{{ db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear el directorio del esquema
  ansible.builtin.file:
    path: "{{ mariadb_schema_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generar el esquema y los datos iniciales desde el template
  ansible.builtin.template:
    src: schema.sql.j2
    dest: "{{ mariadb_schema_file }}"
    owner: root
    group: root
    mode: "0644"

# --- Importacion controlada ------------------------------------------------

- name: Consultar si la tabla ya existe
  ansible.mariadb.mariadb_query:
    login_db: information_schema
    query: >-
      SELECT COUNT(*) AS n FROM information_schema.tables
      WHERE table_schema = %s AND table_name = %s
    positional_args:
      - "{{ db_name }}"
      - "{{ db_table }}"
    login_unix_socket: "{{ mariadb_socket }}"
  register: r_tabla
  changed_when: false
  check_mode: false

- name: Contar las filas ya cargadas
  ansible.mariadb.mariadb_query:
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS n FROM `{{ db_table }}`"
    login_unix_socket: "{{ mariadb_socket }}"
  register: r_filas
  changed_when: false
  check_mode: false
  when: r_tabla.query_result[0][0].n | int > 0

- name: Registrar el estado actual de la tabla
  ansible.builtin.set_fact:
    tabla_existe: "{{ r_tabla.query_result[0][0].n | int > 0 }}"
    filas_actuales: "{{ 0 if r_filas.skipped | default(false) else r_filas.query_result[0][0].n }}"

- name: Importar el esquema y los datos iniciales
  ansible.mariadb.mariadb_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ mariadb_schema_file }}"
    login_unix_socket: "{{ mariadb_socket }}"
  when: >-
    not tabla_existe | bool
    or filas_actuales | int < cumpleanios_filas_esperadas | int

- name: Crear el usuario de la aplicacion, con acceso solo desde el servidor web
  ansible.mariadb.mariadb_user:
    name: "{{ db_app_user }}"
    host: "{{ web_host }}"
    password: "{{ db_app_password }}"
    priv: "{{ db_name }}.*:{{ db_app_priv }}"
    state: present
    update_password: "{{ 'always' if db_app_user_recrear | default(false) | bool else 'on_create' }}"
    login_unix_socket: "{{ mariadb_socket }}"
  no_log: true

# --- Endurecimiento equivalente a mysql_secure_installation, con modulos ----

- name: Quitar los usuarios anonimos
  ansible.mariadb.mariadb_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ mariadb_socket }}"

- name: Quitar la base de datos de prueba
  ansible.mariadb.mariadb_db:
    name: test
    state: absent
    login_unix_socket: "{{ mariadb_socket }}"
