---
# firewalld en el servidor web. Se abren solo ssh y http.

- name: Instalar firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Habilitar y arrancar firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Permitir SSH
  ansible.posix.firewalld:
    service: ssh
    state: enabled
    permanent: true
    immediate: true

- name: Permitir HTTP
  ansible.posix.firewalld:
    service: http
    state: enabled
    permanent: true
    immediate: true

- name: Cerrar los servicios que CentOS Stream abre de fabrica y no usamos
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ firewalld_servicios_a_cerrar }}"
