---
# UFW en el servidor de base de datos.

- name: Instalar UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Permitir SSH antes de cualquier otra cosa
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Permitir MariaDB unicamente desde el servidor web
  community.general.ufw:
    rule: allow
    port: "{{ db_port }}"
    proto: tcp
    src: "{{ web_host }}"

- name: Denegar por defecto el trafico entrante
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Permitir por defecto el trafico saliente
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Activar UFW
  community.general.ufw:
    state: enabled
