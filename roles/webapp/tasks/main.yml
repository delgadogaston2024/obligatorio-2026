---
# Servidor de aplicacion: Apache + PHP en CentOS Stream 9.

- name: Instalar Apache, PHP y las dependencias de Python
  ansible.builtin.dnf:
    name: "{{ web_packages }}"
    state: present

- name: Permitir que Apache y PHP se conecten a la base de datos remota
  ansible.posix.seboolean:
    name: httpd_can_network_connect_db
    state: true
    persistent: true

# --- Directorios -----------------------------------------------------------

- name: Crear el DocumentRoot de la aplicacion
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: root
    group: "{{ apache_group }}"
    mode: "0750"
    setype: httpd_sys_content_t

- name: Crear el directorio privado de credenciales
  ansible.builtin.file:
    path: "{{ app_private_dir }}"
    state: directory
    owner: root
    group: "{{ apache_group }}"
    mode: "0750"
    setype: httpd_sys_content_t

# --- Despliegue de la aplicacion -------------------------------------------

- name: Desplegar las credenciales de la base de datos
  ansible.builtin.template:
    src: db_config.php.j2
    dest: "{{ app_private_dir }}/{{ app_config_file }}"
    owner: root
    group: "{{ apache_group }}"
    mode: "0640"
    setype: httpd_sys_content_t
  no_log: true

- name: Desplegar la aplicacion
  ansible.builtin.template:
    src: cumple.php.j2
    dest: "{{ app_root }}/{{ app_entry_file }}"
    owner: root
    group: "{{ apache_group }}"
    mode: "0640"
    setype: httpd_sys_content_t

- name: Configurar el VirtualHost
  ansible.builtin.template:
    src: cumples.conf.j2
    dest: /etc/httpd/conf.d/cumples.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar Apache

- name: Validar la configuracion de Apache
  ansible.builtin.command:
    cmd: httpd -t
  changed_when: false
  check_mode: false

- name: Habilitar y arrancar php-fpm y Apache.
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ web_services }}"

- name: Aplicar la recarga pendiente de Apache
  ansible.builtin.meta: flush_handlers
