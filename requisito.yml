---
# Se corre UNA SOLA VEZ, antes de despliegue.yml, usando el usuario que ya existe en
# las VMs y su password:
# ansible-playbook requisito.yml -k -K -e requisito_ssh_user=sysadmin
# -k  pide el password de SSH
# -K  pide el password de sudo
#
# Deja instalada la clave publica del nodo de control y sudo sin password, para
# que despliegue.yml corra despues sin ningun prompt. Eso no es cosmetico: es condicion
# necesaria para que la evidencia de idempotencia salga limpia.

- name: Requisitos en el nodo de control
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Instalar sshpass en el nodo de control
      ansible.builtin.dnf:
        name: sshpass
        state: present
      become: true

    - name: Registrar el fingerprint SSH de cada servidor antes de conectar
      ansible.builtin.known_hosts:
        name: "{{ hostvars[item].ansible_host }}"
        key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -T 5 ' + hostvars[item].ansible_host) }}"
        state: present
      loop: "{{ groups['servidores'] }}"

    - name: Confirmar que se indico el usuario SSH inicial
      ansible.builtin.assert:
        that:
          - requisito_ssh_user is defined
          - requisito_ssh_user | length > 0
        fail_msg: >-
          Falta el usuario con el que entrar por primera vez. Correr:
          ansible-playbook requisito.yml -k -K -e requisito_ssh_user=<usuario>

    - name: Confirmar que existe la clave publica del nodo de control
      ansible.builtin.assert:
        that:
          - requisito_pubkey_file is file
        fail_msg: >-
          No encuentro {{ requisito_pubkey_file }}. Generar el par en el nodo de
          control con: ssh-keygen -t ed25519 -C "ansible@web" -N ""

- name: Crear el usuario de automatizacion en los dos servidores
  hosts: servidores
  become: true
  gather_facts: true
  vars:
    ansible_user: "{{ requisito_ssh_user }}"
  tasks:
    - name: Asegurar que existe el grupo de administracion del SO
      ansible.builtin.group:
        name: "{{ admin_group }}"
        state: present

    - name: Crear el usuario de automatizacion
      ansible.builtin.user:
        name: "{{ requisito_user }}"
        shell: /bin/bash
        groups: "{{ admin_group }}"
        append: true
        create_home: true
        state: present

    - name: Instalar la clave publica del nodo de control
      ansible.posix.authorized_key:
        user: "{{ requisito_user }}"
        key: "{{ lookup('ansible.builtin.file', requisito_pubkey_file) }}"
        state: present
        exclusive: false

    - name: Comprobar si visudo esta disponible para validar el sudoers
      ansible.builtin.stat:
        path: /usr/sbin/visudo
      register: r_visudo

    - name: Habilitar sudo sin password para el usuario de automatizacion
      ansible.builtin.copy:
        content: "{{ requisito_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/90-ansible
        owner: root
        group: root
        mode: "0440"
        validate: "{{ '/usr/sbin/visudo -cf %s' if r_visudo.stat.exists else omit }}"

- name: Verificar el acceso sin password que necesita despliegue.yml
  hosts: servidores
  gather_facts: false
  tasks:
    - name: Conectar por clave publica como el usuario de automatizacion
      ansible.builtin.ping:

    - name: Escalar a root sin pedir password
      ansible.builtin.command: id -un
      become: true
      changed_when: false
      register: r_whoami

    - name: Confirmar que la escalada llego a root
      ansible.builtin.assert:
        that:
          - r_whoami.stdout == 'root'
        success_msg: "{{ inventory_hostname }}: clave SSH y sudo NOPASSWD funcionando."
        fail_msg: "{{ inventory_hostname }}: sudo escalo a {{ r_whoami.stdout }} en vez de root."
