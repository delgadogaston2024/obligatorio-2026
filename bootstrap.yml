---
# Se corre UNA SOLA VEZ, antes de site.yml, usando el usuario que ya existe en
# las VMs y su password:
#
#   ansible-playbook bootstrap.yml -k -K -e bootstrap_ssh_user=<usuario_existente>
#
#     -k  pide el password de SSH
#     -K  pide el password de sudo
#
# Deja instalada la clave publica del nodo de control y sudo sin password, para
# que site.yml corra despues sin ningun prompt. Eso no es cosmetico: es condicion
# necesaria para que la evidencia de idempotencia salga limpia.
#
# La letra prohibe cambios manuales POSTERIORES al despliegue, no preparar el
# canal de acceso. Todo lo que hace este playbook esta documentado en
# docs/INSTALL.md como requisito previo.

- name: Preflight en el nodo de control
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Confirmar que se indico el usuario SSH inicial
      ansible.builtin.assert:
        that:
          - bootstrap_ssh_user is defined
          - bootstrap_ssh_user | length > 0
        fail_msg: >-
          Falta el usuario con el que entrar por primera vez. Correr:
          ansible-playbook bootstrap.yml -k -K -e bootstrap_ssh_user=<usuario>

    - name: Confirmar que existe la clave publica del nodo de control
      ansible.builtin.assert:
        that:
          - bootstrap_pubkey_file is file
        fail_msg: >-
          No encuentro {{ bootstrap_pubkey_file }}. Generar el par en el nodo de
          control con: ssh-keygen -t ed25519 -C "ansible@web" -N ""

    - name: Confirmar que el inventario ya tiene las IPs reales
      ansible.builtin.assert:
        that:
          - "'CAMBIAR' not in hostvars[item].ansible_host"
        fail_msg: "Falta poner la IP real de {{ item }} en inventory/hosts.ini"
      loop: "{{ groups['servidores'] }}"

- name: Crear el usuario de automatizacion en los dos servidores
  hosts: servidores
  become: true
  gather_facts: true
  vars:
    # Un ansible_user de group_vars le gana a la opcion -u de la linea de
    # comandos, asi que el usuario inicial hay que forzarlo desde play vars.
    ansible_user: "{{ bootstrap_ssh_user }}"
  tasks:
    - name: Crear el usuario de automatizacion
      ansible.builtin.user:
        name: "{{ bootstrap_user }}"
        shell: /bin/bash
        groups: "{{ admin_group }}"
        append: true
        create_home: true
        state: present

    - name: Instalar la clave publica del nodo de control
      # Se corre tambien contra el propio nodo de control: esta en su inventario,
      # asi que Ansible le abre una conexion SSH a si mismo. Sin esto, site.yml
      # falla en Gathering Facts con "Permission denied (publickey)".
      ansible.posix.authorized_key:
        user: "{{ bootstrap_user }}"
        key: "{{ lookup('ansible.builtin.file', bootstrap_pubkey_file) }}"
        state: present
        exclusive: false

    - name: Comprobar si visudo esta disponible para validar el sudoers
      # Ubuntu 26 usa sudo-rs, que puede no traer visudo en la misma ruta.
      ansible.builtin.stat:
        path: /usr/sbin/visudo
      register: r_visudo

    - name: Habilitar sudo sin password para el usuario de automatizacion
      # Drop-in en sudoers.d y de una sola linea: en sudoers gana la ultima
      # coincidencia, y sudo-rs puede ignorar en silencio directivas Defaults
      # que no soporta. El nombre no puede llevar punto ni tilde o sudo lo ignora.
      ansible.builtin.copy:
        content: "{{ bootstrap_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/90-ansible
        owner: root
        group: root
        mode: "0440"
        validate: "{{ '/usr/sbin/visudo -cf %s' if r_visudo.stat.exists else omit }}"

- name: Verificar el acceso sin password que necesita site.yml
  hosts: servidores
  gather_facts: false
  tasks:
    - name: Conectar por clave publica como el usuario de automatizacion
      ansible.builtin.ping:

    - name: Escalar a root sin pedir password
      ansible.builtin.command: id -un
      become: true
      changed_when: false
      register: r_whoami

    - name: Confirmar que la escalada llego a root
      ansible.builtin.assert:
        that:
          - r_whoami.stdout == 'root'
        success_msg: "{{ inventory_hostname }}: clave SSH y sudo NOPASSWD funcionando."
        fail_msg: "{{ inventory_hostname }}: sudo escalo a {{ r_whoami.stdout }} en vez de root."
