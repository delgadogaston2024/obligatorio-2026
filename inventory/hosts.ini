# Inventario del obligatorio - Taller de Servidores Linux
#
# Los dos servidores estan organizados en grupos, y ambos grupos se agrupan a su
# vez en "servidores" para las tareas comunes.
#
# ANTES DE LA PRIMERA CORRIDA: reemplazar CAMBIAR_IP_WEB y CAMBIAR_IP_DB por las
# IPs reales de las VMs. Son los dos unicos valores del repo que dependen del
# entorno; todo lo demas se deriva de aca.
#
# El usuario de conexion (ansible) se define en group_vars/all/main.yml y lo crea
# bootstrap.yml, que se corre una sola vez. Ver docs/INSTALL.md.

[web]
web01 ansible_host=CAMBIAR_IP_WEB

[db]
db01 ansible_host=CAMBIAR_IP_DB

[servidores:children]
web
db
