# Inventario del obligatorio - Taller de Servidores Linux
#
# Los dos servidores se llaman "web" y "db" (no hay grupos [web]/[db] aparte:
# un grupo con el mismo nombre que su unico host es ambiguo para Ansible y
# genera el warning "Found both group and host with same name"). Los dos
# viven en el grupo "servidores", que se usa para las tareas comunes; site.yml
# y bootstrap.yml seleccionan cada uno por su nombre de host (hosts: web /
# hosts: db).
#
# La IP de cada servidor es de los pocos valores del repo que dependen del
# entorno. Se actualiza editando este archivo (queda para el proximo
# despliegue tambien).
#
# El usuario de conexion (ansible) se define en group_vars/all/main.yml y lo crea
# bootstrap.yml, que se corre una sola vez. Ver docs/INSTALL.md.

[servidores]
web ansible_host=172.18.3.120
db  ansible_host=172.18.3.119
