[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
collections_path     = collections
vault_password_file  = ~/.ansible/vault_pass_cumples
interpreter_python   = /usr/bin/python3
host_key_checking    = True
retry_files_enabled  = False
display_skipped_hosts = False
forks                = 10

# pipelining = False es a proposito: con become (sudo) y "Defaults requiretty"
# activo en el sudoers de una VM (frecuente en imagenes ya endurecidas, como
# las de este obligatorio), pipelining evita que Ansible pida una pty y sudo
# se queda sin poder mostrar el prompt -- se ve como
# "Timeout waiting for privilege escalation prompt" sin mas detalle. Es la
# incompatibilidad conocida que documenta el propio Ansible entre pipelining
# y requiretty. El costo es una conexion SSH levemente mas lenta por tarea,
# irrelevante con dos hosts.
[ssh_connection]
pipelining = False
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o PasswordAuthentication=yes
